name: yaa
description: "YAA - Application mobile de vente en ligne"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Navigation ──────────────────────────────────────────
  go_router: ^14.8.1

  # ── Network ─────────────────────────────────────────────
  http: ^1.2.2
  # MediaType, pour les envois multipart. Arrivait jusqu'ici via http ;
  # on la déclare pour ne pas dépendre d'un paquet transitif.
  http_parser: ^4.0.2

  # ── Media ───────────────────────────────────────────────
  image_picker: ^1.1.2

  # ── Localisation ────────────────────────────────────────
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_maps_flutter: ^2.9.0
  # Déjà tirée par google_maps_flutter, déclarée ici parce qu'on
  # l'importe directement dans main() pour choisir le renderer.
  google_maps_flutter_android: ^2.19.0
  google_maps_flutter_platform_interface: ^2.12.0

  # ── Data & Serialization ────────────────────────────────

  # ── Local Storage ───────────────────────────────────────
  shared_preferences: ^2.3.4

  # ── UI & Assets ─────────────────────────────────────────
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3
  lucide_icons: ^0.257.0
  phosphor_flutter: ^2.1.0

  # ── Utils ───────────────────────────────────────────────
  url_launcher: ^6.3.1

  # ── Icons ───────────────────────────────────────────────
  remixicon: ^4.9.3
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ── Launcher Icon ───────────────────────────────────────
  flutter_launcher_icons: ^0.14.3

  # ── Code Generation ─────────────────────────────────────

# ── Configuration de l'icône de l'app ─────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  # Carrés 1024×1024 générés depuis logo_off.png (large, ratio ~2.9:1) :
  # une icône de launcher doit être carrée, le logo est donc centré
  # sur un canevas transparent.
  image_path: "assets/images/launcher_icon.png"
  # Icône adaptative Android (fond blanc + logo au centre).
  # Premier plan à part : le masque adaptatif rogne jusqu'à 66 % du
  # canevas, le logo y est donc plus petit que dans image_path.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/launcher_icon_foreground.png"
  # iOS interdit le canal alpha : la transparence est aplatie en blanc.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true

  # ── Fonts ───────────────────────────────────────────────
  fonts:
    # Police de marque, alignée sur yaagn.com
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    # Archivo a été retirée le 07/09/2026 : déclarée lors du travail
    # sur la DA du site, puis abandonnée au profit de PlusJakartaSans.
    # Aucun widget ne l'appelait, mais une police déclarée est
    # embarquée qu'on s'en serve ou non — 15 Mo dans l'APK.

  # ── Assets ──────────────────────────────────────────────
  assets:
    - assets/images/
    - assets/fonts/
    - assets/icones/